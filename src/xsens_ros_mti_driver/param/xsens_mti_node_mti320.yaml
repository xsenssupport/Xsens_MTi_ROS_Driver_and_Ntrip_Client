# MTi-320 specific configuration
# For general documentation, see xsens_mti_node.yaml

scan_for_devices: true
#port: '/dev/ttyUSB0'
#baudrate: 921600

publisher_queue_size: 5
time_option: 2
enable_logging: false

enable_deviceConfig: true

enable_filter_config: false
# For MTi-320: 1 option: 0 = "vru_general"
mti_filter_option: 0

filter_label_rollpitch: "Robust"
filter_label_yaw: "NorthReference"

enable_active_heading_stabilization: true

GNSS_LeverArm: [0.0, 0.0, 0.0]
ublox_platform: 0
enable_beidou: false

pub_utctime: false
pub_sampletime: true
pub_imu: true
pub_quaternion: true
pub_euler: true
pub_free_acceleration: true
pub_angular_velocity: true
pub_acceleration: true
pub_dq: false
pub_dv: false
pub_mag: true
pub_temperature: true
pub_pressure: false
pub_accelerationhr: true
pub_angular_velocity_hr: true
pub_transform: true
pub_status: true
pub_twist: true
pub_gnss: false
pub_positionLLA: false
pub_velocity: false
pub_nmea: false
pub_gnsspose: false
pub_odometry: false
pub_euler_stddev: false
pub_ship_motion: false

output_data_rate: 100
output_data_rate_lower: 100
output_data_rate_baro_mtione: 50

enable_high_rate: true
output_data_rate_acchr: 200
output_date_rate_gyrohr: 200
interpolate_orientation_high_rate: true

enable_orientation_smoother: true
enable_position_velocity_smoother: true
enable_continuous_zero_rotation_update: true

enable_inrun_compass_calibration: false

enable_setting_baudrate: true
set_baudrate_value: 2000000
port_config_hardware_flow_control: false

enable_manual_gyro_bias: true
manual_gyro_bias_param: [15, 3]

enable_rotsensor_frame_config: false
rotsensor_rotation_euler: [180.0, 0.0, 0.0]

linear_acceleration_stddev: [0.0, 0.0, 0.0]
angular_velocity_stddev: [0.0, 0.0, 0.0]
magnetic_field_stddev: [0.0, 0.0, 0.0]
orientation_stddev: [0.0, 0.0, 0.0]
